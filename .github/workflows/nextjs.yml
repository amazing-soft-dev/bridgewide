# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            { echo "manager=yarn"; echo "command=install"; echo "runner=yarn"; } >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            { echo "manager=npm"; echo "command=ci"; echo "runner=npx --no-install"; } >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        # No `static_site_generator: next` here. That option only knows how to
        # patch next.config.js/.mjs. This repo uses next.config.ts, so the action
        # wrote a separate next.config.js that overrode it. next.config.ts
        # switches to a static export itself when NEXT_OUTPUT=export (see the
        # build step).
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.css') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Restore responsive images
        uses: actions/cache@v6
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'src/lib/image-sizes.json', 'scripts/optimize-images.mjs') }}
      - name: Build responsive images
        run: npm run images
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          # Static HTML export to ./out. The /api form routes are not included.
          NEXT_OUTPUT: export
          # Sub-path the site is served from. Empty because the site is served
          # from the root of the custom domain (www.bridgewide.org).
          # It is pinned here on purpose: configure-pages' `base_path` output
          # is "/bridgewide" whenever the custom domain is not active at build
          # time, which made every asset URL 404 on the custom domain.
          # To serve from https://<owner>.github.io/bridgewide instead, set the
          # repository variable PAGES_BASE_PATH to /bridgewide.
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '' }}
          # Canonical origin for metadata, sitemap.xml and robots.txt.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://www.bridgewide.org' }}
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
