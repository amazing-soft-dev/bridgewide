# Continuous integration.
#
# Runs on every pull request into `dev` or `main`, and on pushes to `dev`.
# Deployment to GitHub Pages is separate: see nextjs.yml, which runs on pushes
# to `main`.
#
# Branch flow (see README "CI/CD"):
#   fix/* feat/* ... --auto-pr.yml-->  dev  --release.yml-->  main --nextjs.yml--> Pages
#
# "CI passed" is the one status check branch rules require. It fails unless
# every other job succeeded, so jobs can be added here without touching the
# rules. On pull requests it also posts a checks-summary comment.
name: CI

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR. A newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # server: the full app with the /api form routes (Vercel or a Node host).
        # static: the GitHub Pages export, built the same way nextjs.yml builds it.
        target: [server, static]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.target }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.target }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - if: matrix.target == 'static'
        name: Restore responsive images
        uses: actions/cache@v6
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'src/lib/image-sizes.json', 'scripts/optimize-images.mjs') }}
      - if: matrix.target == 'static'
        name: Build responsive images
        run: npm run images
      - name: Build
        run: npx --no-install next build
        env:
          NEXT_OUTPUT: ${{ matrix.target == 'static' && 'export' || '' }}
          # Same settings as the production deploy in nextjs.yml.
          PAGES_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://www.bridgewide.org
      - name: Check static export output
        if: matrix.target == 'static'
        run: |
          for f in index.html 404.html sitemap.xml robots.txt apple-icon opengraph-image; do
            test -e "out/$f" || { echo "::error::out/$f is missing from the static export"; exit 1; }
          done
          if [ -d out/api ]; then
            echo "::error::out/api should not exist in the static export"; exit 1
          fi
          # Every responsive image referenced by the HTML must have been built.
          missing=$(grep -rhoE '/_img/[^" ,?]+\.webp' out --include='*.html' | sort -u | while read -r p; do test -f "out$p" || echo "$p"; done)
          if [ -n "$missing" ]; then
            echo "::error::Image files referenced in HTML are missing:"; echo "$missing"; exit 1
          fi
          # Asset URLs must match where the site is served (the domain root).
          if grep -q '"/bridgewide/_next/' out/index.html; then
            echo "::error::index.html references /bridgewide/_next/ but the site is served from the domain root"; exit 1
          fi

  ci-passed:
    name: CI passed
    needs: [quality, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post checks summary on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "⚪";; *) echo "❌";; esac; }
          if [ "$QUALITY" = success ] && [ "$BUILD" = success ]; then
            verdict="✅ **All checks passed.** This PR will merge automatically."
          else
            verdict="❌ **Checks failed.** Push a fix to this branch; the PR updates and CI runs again."
          fi
          # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
          files=$(gh pr diff "$PR" --repo "$REPO" --name-only | head -50 | sed 's/^/- `/; s/$/`/')
          count=$(gh pr diff "$PR" --repo "$REPO" --name-only | wc -l)
          marker="<!-- ci-summary -->"
          body=$(cat <<BODY
          $marker
          ### CI summary for \`${SHA:0:7}\`

          $verdict

          | Check | Result |
          | --- | --- |
          | Lint and type check | $(icon "$QUALITY") $QUALITY |
          | Builds (server, static) | $(icon "$BUILD") $BUILD |

          <details><summary>Changed files ($count)</summary>

          $files
          </details>

          [Full run log]($RUN_URL)
          BODY
          )
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          # Update the existing summary comment instead of adding a new one each push.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body "$body"
          fi
      - name: Fail unless every job succeeded
        if: needs.quality.result != 'success' || needs.build.result != 'success'
        run: |
          echo "::error::Lint and type check: ${{ needs.quality.result }}, builds: ${{ needs.build.result }}"
          exit 1
